apiVersion: v1
kind: Namespace
metadata:
  name: visitor-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: visitor-config
  namespace: visitor-system
data:
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CLUSTER_NAME: minikube-primary
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: visitor-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        args: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: visitor-system
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visitor-web
  namespace: visitor-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visitor-web
  template:
    metadata:
      labels:
        app: visitor-web
    spec:
      containers:
      - name: web
        image: visitor-counter:local
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: visitor-config
        ports:
        - name: http
          containerPort: 5000
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: visitor-web
  namespace: visitor-system
spec:
  type: NodePort
  selector:
    app: visitor-web
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30080
